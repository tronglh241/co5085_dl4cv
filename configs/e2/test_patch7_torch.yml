data:
  test:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.mnist
        name: MNIST
        kwargs:
          root: "'data/'"
          split: "'test'"
          transform: 'transforms.Compose([
            transforms.ToTensor(),
            transforms.Normalize((0.1308,), (0.3082,)),
          ])'
      shuffle: False
      batch_size: 512

model:
  module: models.e2.transformer
  name: TransformerClassifier
  kwargs:
    tokenizer:
      module: models.e2.tokenizers
      name: PatchTokenizer
      kwargs:
        image_size: 28
        patch_size: 7
        in_channels: 1
        embed_dim: 64
    depth: 4
    num_heads: 4
    mlp_ratio: 2
    dropout: 0.1
    attn_impl: "'torch'"
    num_classes: 10

evaluator:
  module: common.engine.evaluator
  name: Evaluator
  kwargs:
    data: data.test
    model: model
    device: null

metrics:
  loss:
    module: common.metrics.loss
    name: Loss
    kwargs:
      loss_fn:
        module: torch.nn
        name: CrossEntropyLoss
  accuracy:
    module: common.metrics.accuracy
    name: Accuracy
    kwargs:
      num_classes: 10
  precision:
    module: common.metrics.precision
    name: Precision
    kwargs:
      num_classes: 10
      average: True
  recall:
    module: common.metrics.recall
    name: Recall
    kwargs:
      num_classes: 10
      average: True
  f1_score:
    module: common.metrics.f1_score
    name: F1Score
    kwargs:
      num_classes: 10
      average: True

logging:
  tensorboard:
    module: common.handlers.logging.tensorboard
    name: TensorBoardLogger
    kwargs:
      log_dir: "'logs/e2/test_patch7_torch'"
  tqdm:
    module: common.handlers.logging.tqdm_logger
    name: TQDMLogger

loader:
  module: common.handlers.checkpoint.loader
  name: CheckpointLoader
  kwargs:
    path: "'checkpoints/e2/train_patch7_torch/261031032924/best_epoch_48_loss=0.0621.pt'"

seed: 42

extralibs:
  transforms: torchvision.transforms
