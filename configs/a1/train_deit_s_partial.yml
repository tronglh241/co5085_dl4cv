# Generated by scripts/a1/make_configs.py. Edit that file and regenerate.
data:
  train:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.food101
        name: Food101
        kwargs:
          root: "'data/food101_256'"
          split: "'train'"
          fraction: 1.0
          transform: transforms.Compose([transforms.RandomHorizontalFlip(p=0.5), transforms.RandomRotation(degrees=15), transforms.ColorJitter(brightness=0.2,
            contrast=0.2, saturation=0.2, hue=0.1), transforms.RandomAffine(degrees=0, translate=(0.1, 0.1)), transforms.ToTensor(),
            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225])])
      batch_size: 128
      shuffle: true
      num_workers: 8
      collate_fn: collate_batch
      pin_memory: true
      persistent_workers: true
      drop_last: true
  train_eval:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.food101
        name: Food101
        kwargs:
          root: "'data/food101_256'"
          split: "'train'"
          fraction: 0.1
          transform: transforms.Compose([transforms.ToTensor(), transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224,
            0.225])])
      batch_size: 256
      shuffle: false
      num_workers: 4
      collate_fn: collate_batch
      pin_memory: true
      persistent_workers: true
      drop_last: false
  valid:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.food101
        name: Food101
        kwargs:
          root: "'data/food101_256'"
          split: "'val'"
          fraction: 1.0
          transform: transforms.Compose([transforms.ToTensor(), transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224,
            0.225])])
      batch_size: 256
      shuffle: false
      num_workers: 4
      collate_fn: collate_batch
      pin_memory: true
      persistent_workers: true
      drop_last: false
model:
  module: models.a1.classifier
  name: A1Classifier
  kwargs:
    model_name: "'deit_small_patch16_224.fb_in1k'"
    num_classes: 101
    pretrained: true
    freeze: "'partial'"
    drop_path_rate: 0.0
optimizer:
  module: torch.optim
  name: AdamW
  kwargs:
    params: model.param_groups(0.05)
    lr: 0.0002
loss_fn:
  module: torch.nn
  name: CrossEntropyLoss
  kwargs:
    label_smoothing: 0.1
trainer:
  module: common.engine.trainer
  name: Trainer
  kwargs:
    data: data.train
    model: model
    optimizer: optimizer
    loss_fn: loss_fn
    device: null
    max_epochs: 15
    amp: true
    channels_last: false
    clip_grad_norm: null
evaluators:
  train:
    module: common.engine.evaluator
    name: Evaluator
    kwargs:
      data: data.train_eval
      model: model
      device: null
      amp: true
      channels_last: false
  valid:
    module: common.engine.evaluator
    name: Evaluator
    kwargs:
      data: data.valid
      model: model
      device: null
      amp: true
      channels_last: false
metrics:
  loss:
    module: common.metrics.loss
    name: Loss
    kwargs:
      loss_fn:
        module: torch.nn
        name: CrossEntropyLoss
  accuracy:
    module: common.metrics.accuracy
    name: Accuracy
    kwargs:
      num_classes: 101
  precision:
    module: common.metrics.precision
    name: Precision
    kwargs:
      num_classes: 101
      average: true
  recall:
    module: common.metrics.recall
    name: Recall
    kwargs:
      num_classes: 101
      average: true
  f1_score:
    module: common.metrics.f1_score
    name: F1Score
    kwargs:
      num_classes: 101
      average: true
lr_scheduler:
  module: common.handlers.scheduler.iteration
  name: IterationScheduler
  kwargs:
    scheduler:
      module: common.handlers.scheduler.warmup_cosine
      name: WarmupCosineLR
      kwargs:
        optimizer: optimizer
        warmup_steps: len(data.train) * min(1, trainer.max_epochs - 1)
        total_steps: len(data.train) * trainer.max_epochs
logging:
  tensorboard:
    module: common.handlers.logging.tensorboard
    name: TensorBoardLogger
    kwargs:
      log_dir: "'logs/a1/train_deit_s_partial'"
  tqdm:
    module: common.handlers.logging.tqdm_logger
    name: TQDMLogger
timer:
  module: common.handlers.timer
  name: EpochTimer
  kwargs:
    logger: logging.tensorboard
memory:
  module: common.handlers.memory
  name: PeakMemory
  kwargs:
    logger: logging.tensorboard
best_checkpoint:
  module: common.handlers.checkpoint.best
  name: BestCheckpoint
  kwargs:
    dirname: "'checkpoints/a1/train_deit_s_partial'"
    modules:
    - "'model'"
    evaluator: evaluators.valid
    score_name: "'accuracy'"
    mode: "'max'"
    n_saved: 1
backup_checkpoint:
  module: common.handlers.checkpoint.backup
  name: BackupCheckpoint
  kwargs:
    dirname: "'checkpoints/a1/train_deit_s_partial'"
    modules:
    - "'model'"
    - "'optimizer'"
    - "'trainer'"
    - "'lr_scheduler'"
    - "'best_checkpoint'"
    n_saved: 1
loader:
  module: common.handlers.checkpoint.loader
  name: CheckpointLoader
  kwargs:
    path: null
seed: 42
extralibs:
  transforms: torchvision.transforms
  collate_batch:
    module: datasets.food101
    name: collate_batch
