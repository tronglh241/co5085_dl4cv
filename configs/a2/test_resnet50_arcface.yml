data:
  valid:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.celeba
        name: CelebA
        kwargs:
          root: "'data/celeba_112'"
          split: "'val'"
          transform: transforms.Compose([transforms.ToTensor(), transforms.Normalize([0.5, 0.5, 0.5], [0.5, 0.5, 0.5])])
      batch_size: 256
      shuffle: false
      num_workers: 2
      collate_fn: collate_batch
      pin_memory: true
      persistent_workers: true
      drop_last: false
  valid_pairs:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.celeba
        name: VerificationPairs
        kwargs:
          root: "'data/celeba_112'"
          split: "'val'"
          pairs: "'data/celeba_112/pairs/val.csv'"
      batch_size: 512
      shuffle: false
      num_workers: 0
      pin_memory: true
      persistent_workers: false
      drop_last: false
  test:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.celeba
        name: CelebA
        kwargs:
          root: "'data/celeba_112'"
          split: "'test'"
          transform: transforms.Compose([transforms.ToTensor(), transforms.Normalize([0.5, 0.5, 0.5], [0.5, 0.5, 0.5])])
      batch_size: 256
      shuffle: false
      num_workers: 2
      collate_fn: collate_batch
      pin_memory: true
      persistent_workers: true
      drop_last: false
  test_pairs:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.celeba
        name: VerificationPairs
        kwargs:
          root: "'data/celeba_112'"
          split: "'test'"
          pairs: "'data/celeba_112/pairs/test.csv'"
      batch_size: 512
      shuffle: false
      num_workers: 0
      pin_memory: true
      persistent_workers: false
      drop_last: false
model:
  module: models.a2.embedding
  name: FaceEmbeddingModel
  kwargs:
    backbone: "'resnet50'"
    num_classes: 8192
    embedding_dim: 512
    pretrained: false
    head: "'arcface'"
    dropout: 0.4
evaluator:
  module: models.a2.evaluator
  name: VerificationEvaluator
  kwargs:
    data: data.valid_pairs
    image_data: data.valid
    model: model
    device: null
    channels_last: true
    threshold: null
loader:
  module: common.handlers.checkpoint.loader
  name: CheckpointLoader
  kwargs:
    path: null
extralibs:
  transforms: torchvision.transforms
  collate_batch:
    module: datasets.celeba
    name: collate_batch
